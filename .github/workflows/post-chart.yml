name: Post BTC OI chart

on:
  # Cron lives in conpost-aotori/x-dispatcher (schedule.json): GitHub's scheduler delays and drops runs.
  # The FOMC rows there (fomc_dense) need a yearly update together with fomc_schedule.py.
  workflow_dispatch:
    inputs:
      enable_x:
        description: "Enable X (Twitter) posting for THIS run only"
        type: boolean
        default: false
      force:
        description: "Force post even if same chart was already posted"
        type: boolean
        default: false
      dry_run:
        description: "Generate chart but skip both Discord and X posting"
        type: boolean
        default: false
      skip_discord:
        description: "Skip Discord (use to send only to X)"
        type: boolean
        default: false
      commentary_providers:
        description: "Override commentary provider order (comma-separated, e.g. openai,gemini). Empty = use default chain."
        type: string
        default: ""
      fomc_dense:
        description: "Set by x-dispatcher on the FOMC rows: X only, gated to the announcement window"
        type: boolean
        default: false

permissions:
  contents: write    # needed for _ci_state.sh to push to bot-state branch

concurrency:
  group: oi-time-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # 15 -> 20: extra headroom so one slow run doesn't eat the whole budget.
    # Combined with the tweepy session timeout fix, a stuck run should now
    # fail fast well inside this instead of riding it out to the limit.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK, from upstream release)
        # apt's fonts-noto-cjk (61 MB) sometimes crawls from the Ubuntu mirror and the
        # job hits timeout-minutes before it can post. Fetch the same .ttc files from the
        # pinned upstream release into the same path apt uses (paths/family names unchanged).
        timeout-minutes: 4
        run: |
          set -euo pipefail
          d=/usr/share/fonts/opentype/noto
          sudo mkdir -p "$d"
          base=https://github.com/notofonts/noto-cjk/raw/Sans2.004/Sans/OTC
          for f in NotoSansCJK-Regular.ttc NotoSansCJK-Bold.ttc; do
            sudo curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --max-time 120 -o "$d/$f" "$base/$f"
          done
          sudo fc-cache -f >/dev/null
          fams="$(fc-list : family)"
          grep -qF "Noto Sans CJK JP" <<<"$fams" || { echo "::error::Noto Sans CJK JP not registered"; exit 1; }
          rm -rf ~/.cache/matplotlib

      - name: Restore state from bot-state branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/_ci_state.sh restore

      - name: Generate + post chart
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          COMMENTARY_PROVIDERS: ${{ inputs.commentary_providers }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          IMAGES_DIR: ./images
          # Trial: 30-day window. 14d still left the lower corners empty
          # (BTC hadn't visited $70k area in 2 weeks). 30d reaches further
          # back to capture wider price history.
          # Kline interval is auto-picked (60min for ≥7d).
          # Drop back to "24" to return to last-24h view.
          CHART_LOOKBACK_HOURS: "720"
          CHART_RANGE_PCT: "3"
          # Trial: symmetric ±7% window (both _UP and _DOWN set explicitly,
          # which also disables auto-fit so the wider view is actually shown).
          # Drop both _UP and _DOWN to return to the default 3% auto-fitted view.
          CHART_RANGE_PCT_UP: "7"
          CHART_RANGE_PCT_DOWN: "7"
          POST_TEMPLATE: "【BTC価格帯別OIマップ】 Mark {mark}\n\nVol  買 {vol_buy} / 売 {vol_sell} BTC\nLiq  S {liq_short} / L {liq_long} BTC\nOI   {oi} BTC ({oi_chg})\n\n{commentary}\n\n{timestamp} JST  #BTC #Bitcoin\n※OIはAIが収集したもので推定となります"
          # X gating:
          # Scheduled runs post to X (user-approved 2026-05-28, 6h cadence).
          # Manual runs require inputs.enable_x to be explicitly true.
          ENABLE_X: ${{ github.event_name == 'schedule' && 'true' || (inputs.enable_x && 'true' || 'false') }}
          # FOMC dense mode: true when triggered by any schedule OTHER than the
          # base 6h cron (i.e. one of the FOMC 30-min crons). github.event.schedule
          # is the exact cron string that fired this run. x-dispatcher sets
          # inputs.fomc_dense on the same rows.
          FOMC_DENSE: ${{ (inputs.fomc_dense || (github.event_name == 'schedule' && github.event.schedule != '10 0,6,12,18 * * *')) && 'true' || 'false' }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.skip_discord }}" = "true" ]; then ARGS="$ARGS --skip-discord"; fi
          if [ "$FOMC_DENSE" = "true" ]; then
            # FOMC dense window → X only, gated to the actual announcement window.
            echo "FOMC dense run: X only, window-gated"
            ARGS="$ARGS --skip-discord --require-fomc-window"
          fi
          python post_chart.py $ARGS

      - name: Save state to bot-state branch
        if: ${{ always() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/_ci_state.sh save

      - name: Upload chart as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc_profile_${{ github.run_id }}
          path: images/btc_profile.png
          if-no-files-found: ignore
          retention-days: 14
